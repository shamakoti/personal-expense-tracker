spring.application.name=expense-tracker

# Database connection (credentials come from environment variables)
spring.datasource.url=jdbc:mysql://localhost:3306/expense_tracker?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Never send stack traces or internal messages to the browser
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Login session cookie
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax