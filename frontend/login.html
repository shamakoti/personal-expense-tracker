<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
<main class="auth-card">
    <h1>💰 Expense Tracker</h1>
    <p class="subtitle">Log in to your account</p>

    <div id="page-message" class="alert hidden" role="alert"></div>

    <form id="login-form">
        <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-button">Log in</button>
    </form>

    <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
</main>

<script src="js/api.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
