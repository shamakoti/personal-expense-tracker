<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="app">
    <aside class="sidebar">
        <div class="brand">💰 Expense Tracker</div>
        <nav class="nav" aria-label="Main navigation">
            <a class="nav-link" href="index.html">📊 Dashboard</a>
            <a class="nav-link" href="transactions.html">💸 Transactions</a>
            <a class="nav-link" href="reports.html">📈 Reports</a>
            <a class="nav-link" href="categories.html" aria-current="page">🏷️ Categories</a>
        </nav>
    </aside>

    <main class="content" id="main">
        <header class="page-header">
            <div>
                <h1>Categories</h1>
                <p class="subtitle">Organize your income and expenses</p>
            </div>
        </header>

        <div id="page-message" class="alert hidden" role="alert"></div>

        <section class="panel" aria-labelledby="new-category-title">
            <h2 id="new-category-title">Add a custom category</h2>
            <form id="category-form">
                <div class="form-grid">
                    <div class="field">
                        <label for="category-name">Category name</label>
                        <input id="category-name" name="name" type="text" maxlength="50" required>
                    </div>
                    <div class="field">
                        <label for="category-type">Type</label>
                        <select id="category-type" name="type" required>
                            <option value="EXPENSE">Expense</option>
                            <option value="INCOME">Income</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add category</button>
                </div>
            </form>
        </section>

        <div class="grid-2">
            <section class="panel" aria-labelledby="expense-cat-title">
                <h2 id="expense-cat-title">Expense categories</h2>
                <ul class="category-list" id="expense-categories"></ul>
                <p class="empty-state" id="expense-categories-empty">Loading categories…</p>
            </section>

            <section class="panel" aria-labelledby="income-cat-title">
                <h2 id="income-cat-title">Income categories</h2>
                <ul class="category-list" id="income-categories"></ul>
                <p class="empty-state" id="income-categories-empty">Loading categories…</p>
            </section>
        </div>
    </main>
</div>

<script src="js/api.js" defer></script>
<script src="js/categories.js" defer></script>

</body>
</html>
